# Farbaek for iPhone (ADR 0110). XcodeGen makes Farbaek.xcodeproj from this
# file on the Mac that builds it (.github/workflows/ios.yml), so the project
# is reviewable text here and never a generated file in the repository.
name: Farbaek
options:
  bundleIdPrefix: com.farbaek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    # Swift 5 language mode on the current compiler: no strict concurrency errors.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 65BULQ4657
    CODE_SIGN_STYLE: Automatic
targets:
  Farbaek:
    type: application
    platform: iOS
    sources:
      - path: Farbaek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farbaek.app
        PRODUCT_NAME: Farbaek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only: it runs on iPad and Apple silicon Macs as an iPhone app.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Farbaek/Farbaek.entitlements
    info:
      path: Farbaek/Info.plist
      properties:
        CFBundleDisplayName: Farbaek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.farbaek.app
            CFBundleURLSchemes: [farbaek]
        FarbaekBaseURL: https://www.farbaek.com
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSFaceIDUsageDescription: Farbaek asks for Face ID before it approves a change or starts the agent for you.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Farbaek/Farbaek.entitlements
      properties:
        aps-environment: development
        # Sign in with Apple (ADR 0113).
        com.apple.developer.applesignin: [Default]
  FarbaekTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FarbaekTests
    dependencies:
      - target: Farbaek
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.farbaek.app.tests
  FarbaekUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FarbaekUITests
    dependencies:
      - target: Farbaek
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.farbaek.app.uitests
        TEST_TARGET_NAME: Farbaek
schemes:
  Farbaek:
    build:
      targets:
        Farbaek: all
        FarbaekTests: [test]
        FarbaekUITests: [test]
    test:
      targets:
        - FarbaekTests
        - FarbaekUITests
    archive:
      config: Release
