# Farbaek's changes to Supabase's official self-hosting compose (ADR 0036).
# The official files stay untouched at a pinned commit in
# /opt/farbaek/supabase/docker; COMPOSE_FILE in its .env lists this file
# after theirs, so every `docker compose` there applies it.
#
# - Only what Farbaek uses runs: Postgres, Auth, PostgREST, the gateway,
#   postgres-meta and Studio. Realtime, Storage, imgproxy, Edge Functions and
#   Supavisor are switched off.
# - Nothing is published to the internet. Docker's published ports bypass
#   ufw, so the gateway's 8000 is removed: Caddy reaches it on Farbaek's
#   network and forwards only /auth/v1 and /rest/v1. Studio listens on the
#   server's loopback only, for an SSH tunnel.

services:
  realtime:
    profiles: ["off"]
  storage:
    profiles: ["off"]
  imgproxy:
    profiles: ["off"]
  functions:
    profiles: ["off"]
  supavisor:
    profiles: ["off"]

  # The same Auth version as the Supabase Cloud project the data comes from
  # (2.197.0, released 2026-09-09), so auth's tables have the same columns.
  auth:
    image: supabase/gotrue:v2.197.0
    # The browser check at sign-in (ADR 0067). Off until
    # scripts/vps/set-turnstile.ps1 puts both values in this folder's .env.
    # Requests made with the server's secret key skip it.
    environment:
      GOTRUE_SECURITY_CAPTCHA_ENABLED: ${FARBAEK_CAPTCHA_ENABLED:-false}
      GOTRUE_SECURITY_CAPTCHA_PROVIDER: turnstile
      GOTRUE_SECURITY_CAPTCHA_SECRET: ${FARBAEK_CAPTCHA_SECRET:-}
      # Sign-in emails (public/auth-email/, served by the app). Office Space's
      # carry only the 6-digit code; customers' carry the link. Auth falls back
      # to its built-in link-only emails if it can't fetch these.
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: https://www.farbaek.com/auth-email/magic-link.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: https://www.farbaek.com/auth-email/confirmation.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Sign in to Farbaek
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirm your email for Farbaek

  api-gw:
    ports: !reset []
    networks:
      farbaek:
        aliases:
          - supabase-gw

  studio:
    ports:
      - "127.0.0.1:54323:3000"

networks:
  farbaek:
    external: true
    name: farbaek_default
