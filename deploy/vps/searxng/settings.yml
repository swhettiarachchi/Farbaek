# SearXNG for Farbaek Chat's live web search (stage 205, ADR 0222). Private: only the app reaches it, over the `web`
# network; it publishes no port. Its secret is generated at every start (compose.yaml), so none is stored anywhere.
# Defaults come from SearXNG itself; only these settings change.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - bing
      - qwant
      - wikipedia
      - bing news
      - brave.news
      - qwant news

general:
  instance_name: "Farbaek search"
  # No statistics pages and no records of what was searched.
  enable_metrics: false

server:
  # Read from SEARXNG_SECRET, set at start (compose.yaml).
  secret_key: "set-at-start"
  limiter: false
  image_proxy: false
  public_instance: false
  method: "GET"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 3.0
  max_request_timeout: 4.0
  pool_connections: 50
  pool_maxsize: 10
  enable_http2: true

engines:
  # Off in SearXNG's defaults: turned on here so more than one index answers.
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: qwant news
    disabled: false
