# Farbaek for Android (ADR 0099): builds the Google Play bundle on GitHub's
# Linux runner, signed with the owner's upload key, checks the signature and
# the package name, and keeps the bundle, its SHA-256 and the certificate's
# fingerprint (public, for /.well-known/assetlinks.json) as the run's
# artifact for 7 days. Uploading to Play Console is by hand
# (docs/mobile/android.md); nothing here can reach Google Play.
#
# Secrets (repository settings, set by the owner with
# scripts/release/android-signing.ps1): ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD.
name: Android app

on:
  push:
    paths:
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      signing: ${{ steps.check.outputs.signing }}
    steps:
      - id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            echo "signing=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signing=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing isn't set up yet, so the bundle wasn't built. See docs/mobile/android.md."
          fi

  bundle:
    needs: ready
    if: needs.ready.outputs.signing == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"

      - name: The upload key, as a file only this job can read
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "FARBAEK_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Build the bundle
        env:
          FARBAEK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android :app:bundleRelease --no-daemon

      - name: Check the signature and the package
        env:
          FARBAEK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          version=$(grep '^versionName=' android/version.properties | cut -d= -f2)
          mkdir -p out
          cp "$aab" "out/farbaek-$version.aab"
          jarsigner -verify -strict "out/farbaek-$version.aab"
          # The manifest inside the bundle is binary XML; the package name is still readable in it.
          unzip -p "out/farbaek-$version.aab" base/manifest/AndroidManifest.xml | strings | grep -q "com.farbaek.app"
          (cd out && sha256sum "farbaek-$version.aab" > "farbaek-$version.aab.sha256")
          keytool -list -v -keystore "$FARBAEK_ANDROID_KEYSTORE" -storetype pkcs12 -storepass:env FARBAEK_ANDROID_KEYSTORE_PASSWORD -alias farbaek-upload \
            | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' > out/upload-certificate-sha256.txt
          {
            echo "### Farbaek for Android"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| \`farbaek-$version.aab\` | $(stat -c %s "out/farbaek-$version.aab") | \`$(cut -d' ' -f1 out/*.aab.sha256)\` |"
            echo
            echo "Signed with the upload key (verified). Upload certificate SHA-256, for src/config/android-app.ts: \`$(cat out/upload-certificate-sha256.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farbaek-android
          path: out/
          retention-days: 7
          if-no-files-found: error
