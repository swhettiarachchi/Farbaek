# Farbaek Agent for Mac (ADR 0098). A Mac app can only be built and signed on
# macOS, so GitHub's macOS runner builds it: one DMG for Apple silicon and
# Intel, signed with the owner's Developer ID and notarized by Apple, so it
# opens without a warning. The run then checks Gatekeeper accepts it as
# notarized, opens it from the DMG to see it start, and keeps the DMG, its
# SHA-256 and a screenshot as the run's artifact for 7 days. Publishing is by
# hand (docs/agent/README.md, "Publishing a release"): nothing here can reach
# Farbaek's server.
#
# Secrets (repository settings, set by the owner; docs/agent/README.md, "Mac
# signing"): MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER.
#
# It runs when the agent's version changes, or from "Run workflow". macOS
# minutes count ten times against the repository's free minutes, so a quick
# Linux job checks the secrets first; when the free minutes run out, GitHub
# stops jobs until next month instead of charging.
name: Agent for Mac

on:
  push:
    paths:
      - desktop/app/package.json
      - desktop/electron-builder.yml
      - .github/workflows/agent-mac.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      signing: ${{ steps.check.outputs.signing }}
    steps:
      - id: check
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then
            echo "signing=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signing=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Mac signing isn't set up yet, so the Mac app wasn't built. See docs/agent/README.md, Mac signing."
          fi

  build:
    needs: ready
    if: needs.ready.outputs.signing == 'yes'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # electron-builder downloads both Electron builds itself; the dev copy isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The Developer ID certificate, imported by electron-builder into a temporary keychain.
      CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1

      - name: The notarization key, as a file only this job can read
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build the app
        run: node desktop/build.mjs --production

      - name: Package, sign and notarize
        run: pnpm exec electron-builder --mac --config desktop/electron-builder.yml --publish never

      - name: Check Gatekeeper accepts it, and open it
        run: |
          set -euo pipefail
          dmg=$(ls desktop/release/Farbaek-Agent-*-mac.dmg)
          mkdir -p out
          cp "$dmg" out/
          (cd out && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/farbaek-dmg
          app="/tmp/farbaek-dmg/Farbaek Agent.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "^(Identifier|Authority=Developer ID Application|TeamIdentifier)"
          # Accepted as notarized: what a person's Mac checks before it opens the app.
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt
          xcrun stapler validate "$app"
          lipo -archs "$app/Contents/MacOS/Farbaek Agent"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$app/Contents/Info.plist"
          open -n "$app"
          sleep 20
          # Still running 20 seconds after opening: it started and didn't crash.
          pgrep -f "Farbaek Agent.app/Contents/MacOS/Farbaek Agent" > /dev/null
          screencapture -x out/first-open.png || echo "No screenshot on this runner."
          osascript -e 'quit app "Farbaek Agent"' || pkill -f "Farbaek Agent.app" || true
          sleep 3
          hdiutil detach /tmp/farbaek-dmg || hdiutil detach -force /tmp/farbaek-dmg
          {
            echo "### Farbaek Agent for Mac"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| \`$(basename "$dmg")\` | $(stat -f %z "$dmg") | \`$(cut -d' ' -f1 out/*.sha256)\` |"
            echo
            echo "Signed with Developer ID, notarized and stapled; Gatekeeper accepts it; both architectures; still running 20 seconds after opening from the DMG."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farbaek-agent-mac
          path: out/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
