# Farbaek for iPhone (ADR 0110). An iPhone app can only be built on macOS,
# so GitHub's macOS runner builds it.
#
# - check: makes the Xcode project from ios/project.yml with XcodeGen (a
#   pinned release, checked against its SHA-256), builds the app for the
#   simulator and runs its tests, which decode the server's real sample
#   answers. No signing, no secrets.
# - testflight: only when started by hand with "Upload to TestFlight" and
#   once the owner's App Store Connect key is set: archives, signs with
#   Apple's cloud-managed certificate for team 65BULQ4657, and uploads the
#   build to TestFlight. Releasing it to the App Store is by hand in App
#   Store Connect (docs/mobile/ios.md); nothing here can.
#
# Secrets for testflight (repository settings, set by the owner; docs/mobile/ios.md):
# IOS_ASC_KEY_P8, IOS_ASC_KEY_ID, IOS_ASC_ISSUER.
#
# macOS minutes count ten times against the repository's free minutes, so
# this runs only when ios/ or this file changes, or from "Run workflow".
name: iPhone app

on:
  push:
    paths:
      - ios/**
      - .github/workflows/ios.yml
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (needs the App Store Connect key)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The newest Xcode on the runner
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: XcodeGen, pinned and checked
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "XCODEGEN=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)" >> "$GITHUB_ENV"

      - name: Make the project
        run: '"$XCODEGEN" generate --spec ios/project.yml'

      - name: Pick the biggest iPhone simulator (the App Store's 6.9-inch screenshots)
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, ds in sorted(devices.items(), reverse=True) if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')]
          best = [d for d in phones if 'Pro Max' in d['name']] or phones
          print(best[0]['udid'])
          ")
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Build and run the unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/Farbaek.xcodeproj \
            -scheme Farbaek \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -only-testing:FarbaekTests \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tail -n 150
          {
            echo "### Farbaek for iPhone"
            echo
            echo "Built for the simulator and its unit tests passed on $(xcodebuild -version | head -1)."
          } >> "$GITHUB_STEP_SUMMARY"

      # The tour reads the sample from www.farbaek.com, so it waits until the server has the newest route it walks.
      - name: Tour the sample and take screenshots
        run: |
          set -euo pipefail
          if ! curl -fsS -o /dev/null https://www.farbaek.com/api/v1/app/sample/projects/00000000-0000-4000-8000-00000000a001; then
            echo "::notice::www.farbaek.com doesn't answer the sample's projects yet, so the UI tour didn't run. Start it with Run workflow once the server is live."
            exit 0
          fi
          xcodebuild test \
            -project ios/Farbaek.xcodeproj \
            -scheme Farbaek \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -only-testing:FarbaekUITests \
            -resultBundlePath "$RUNNER_TEMP/tour.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tail -n 80
          mkdir -p out/screenshots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tour.xcresult" --output-path out/screenshots
          echo "The sample tour passed; its screenshots are in this run's artifact." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: farbaek-iphone-screenshots
          path: out/screenshots
          if-no-files-found: ignore

  ready:
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      signing: ${{ steps.check.outputs.signing }}
    steps:
      - id: check
        env:
          P8: ${{ secrets.IOS_ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ISSUER: ${{ secrets.IOS_ASC_ISSUER }}
        run: |
          if [ -n "$P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then
            echo "signing=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signing=no" >> "$GITHUB_OUTPUT"
            echo "::warning::The App Store Connect key isn't set, so nothing was uploaded. See docs/mobile/ios.md."
          fi

  testflight:
    needs: [check, ready]
    if: needs.ready.outputs.signing == 'yes'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
      ASC_ISSUER: ${{ secrets.IOS_ASC_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The newest Xcode on the runner
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: XcodeGen, pinned and checked
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)" generate --spec ios/project.yml

      - name: The App Store Connect key, as a file only this job can read
        env:
          P8: ${{ secrets.IOS_ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Automatic signing archives with a development profile, which needs a registered
      # device, and the team has none. An App Store profile needs no devices, so this run
      # makes its own through the App Store Connect API (scripts/release/ios-asc-signing.mjs):
      # an Apple Distribution certificate from a key made here, and a profile for the app.
      # The next run revokes this run's certificate, after Apple has processed the upload.
      - name: A distribution certificate and App Store profile for this run
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUNDLE_ID: com.farbaek.app
        run: |
          set -euo pipefail
          umask 077
          sign="$RUNNER_TEMP/signing"
          mkdir -p "$sign"
          # macOS's own LibreSSL, whose PKCS#12 files the keychain imports.
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes -keyout "$sign/key.pem" -out "$sign/csr.pem" -subj "/CN=Farbaek CI/O=Farbaek" 2>/dev/null
          node scripts/release/ios-asc-signing.mjs setup "$sign"
          /usr/bin/openssl x509 -inform DER -in "$sign/cert.cer" -out "$sign/cert.pem"
          p12pass=$(/usr/bin/openssl rand -hex 16)
          echo "::add-mask::$p12pass"
          /usr/bin/openssl pkcs12 -export -inkey "$sign/key.pem" -in "$sign/cert.pem" -out "$sign/sign.p12" -passout "pass:$p12pass"

          # A keychain only this job uses, with the key, its certificate and Apple's intermediate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(/usr/bin/openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          curl -fsSL -o "$sign/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$sign/wwdr.cer" -k "$keychain" -T /usr/bin/codesign
          security import "$sign/sign.p12" -k "$keychain" -P "$p12pass" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$sign/key.pem" "$sign/sign.p12"
          security find-identity -v -p codesigning "$keychain" | sed -E 's/[0-9A-F]{40}/<hash>/'

          # The profile where Xcode looks for it, under its own UUID.
          uuid=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).uuid)' "$sign/profile.json")
          name=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).name)' "$sign/profile.json")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$sign/profile.mobileprovision" "$d/$uuid.mobileprovision"
          done
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

          # An App Store profile carries production push; the project's file says development.
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" ios/Farbaek/Farbaek.entitlements

      - name: Archive, sign and upload to TestFlight
        run: |
          set -euo pipefail
          # Each upload needs a new build number: this workflow's run number.
          xcodebuild archive \
            -project ios/Farbaek.xcodeproj \
            -scheme Farbaek \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Farbaek.xcarchive" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=65BULQ4657 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" | tail -n 60
          # The export signs with the same profile and uploads with the App Store Connect key.
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :signingStyle manual" \
            -c "Add :signingCertificate string \"Apple Distribution\"" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:com.farbaek.app string \"$PROFILE_NAME\"" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Farbaek.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER" | tail -n 60
          {
            echo "### Farbaek for iPhone"
            echo
            echo "Build ${GITHUB_RUN_NUMBER} uploaded to App Store Connect. It appears in TestFlight once Apple has processed it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key and the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/signing/key.pem" "$RUNNER_TEMP/signing/sign.p12"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
