# Farbaek for Android: does it open? Builds the release APK (the same app as the Play bundle,
# signed with the upload key), installs it on an Android emulator that has Google Play and
# Chrome, launches it, and keeps a screenshot and the system log as the run's artifact.
# Runs on every change to the app, or by hand from Actions > "Android launch check". Linux minutes
# only; nothing reaches Play. Version 1.0.0 stopped at launch, and only a real launch shows that.
name: Android launch check

on:
  workflow_dispatch:
  push:
    paths:
      - android/**
      - .github/workflows/android-launch.yml

permissions:
  contents: read

jobs:
  launch:
    # A fixed image, so ubuntu-latest moving to a newer one can't change the emulator's setup between runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"

      - name: The upload key, as a file only this job can read
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "FARBAEK_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          FARBAEK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android :app:assembleRelease --no-daemon

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"

      - name: Start an Android 14 emulator with Google Play and Chrome
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image="system-images;android-34;google_apis_playstore;x86_64"
          yes | "$sdk/sdkmanager" --install "$image" emulator platform-tools > /dev/null
          # adb and the emulator, for this step and the next.
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # One AVD folder for both tools: left alone, avdmanager and the emulator look in different places.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/avdmanager" create avd -n launch -k "$image" -d pixel_6
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx launch || { echo "::error::avdmanager didn't make the AVD."; ls -la "$ANDROID_AVD_HOME"; exit 1; }
          ls -l /dev/kvm || echo "::warning::No /dev/kvm on this runner: the emulator can't use hardware acceleration."
          # A Google Play image only lets in an adb key it was given at boot. Run 17 showed the emulator up but "device
          # unauthorized": adb made its key only after the emulator had started. So the key is made first, and the
          # emulator is also told to skip the authorization prompt.
          adb start-server
          ls ~/.android/adbkey.pub >/dev/null || { echo "::error::adb didn't make its key."; exit 1; }
          nohup "$ANDROID_HOME/emulator/emulator" -avd launch -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on -skip-adb-auth > "$RUNNER_TEMP/emulator.log" 2>&1 &
          # The job log is hard to read from a browser, so a failure also puts what adb sees and the emulator's log in the run's summary.
          emulator_failed() {
            echo "::error::$1 The emulator's log is in the run's summary."
            { echo "### $1"; echo; echo "Runner: $(lsb_release -ds 2>/dev/null). KVM: $(ls -l /dev/kvm 2>&1)."; echo; echo '```'; adb devices -l 2>&1; echo; tail -n 60 "$RUNNER_TEMP/emulator.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          # Give up after 6 minutes rather than waiting for the job's limit, and say why.
          timeout 360 adb wait-for-device || emulator_failed "adb couldn't reach the emulator within 6 minutes."
          for i in $(seq 1 90); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] || emulator_failed "Android didn't finish booting."
          adb shell input keyevent 82 || true

      - name: Install and open Farbaek
        run: |
          set -x
          mkdir -p out
          adb install -r android/app/build/outputs/apk/release/app-release.apk
          adb shell pm list packages | grep -E "com.farbaek.app|com.android.chrome" | tee out/packages.txt
          adb shell dumpsys package com.android.chrome | grep -m1 versionName | tee -a out/packages.txt || true
          adb logcat -c
          adb shell am start -W -n com.farbaek.app/com.google.androidbrowserhelper.trusted.LauncherActivity | tee out/am-start.txt
          sleep 25
          adb exec-out screencap -p > out/launch-25s.png
          sleep 20
          adb exec-out screencap -p > out/launch-45s.png
          adb shell dumpsys activity activities | grep -E "ResumedActivity|topResumedActivity" | tee out/resumed.txt || true

          # Nearby (ADR 0193): the link the Mesh page uses opens the native screen; turning on "Visible to your
          # computers" starts the dataSync foreground service, the step Android 14 and 15's rules can stop.
          adb shell pm grant com.farbaek.app android.permission.POST_NOTIFICATIONS || true
          adb shell am start -W -a android.intent.action.VIEW -d "farbaek-mesh://nearby" com.farbaek.app | tee out/nearby-start.txt
          # Nearby opens at once and shows "Starting Nearby…" while its key loads, which is slow on an emulator with
          # software graphics, and uiautomator fails while the screen is busy. Run 18 dumped once, at 8 s, and got
          # nothing, and run 20 still said "Starting Nearby…" at 90 s while the emulator's key store was busy. So look
          # every 3 seconds for up to 3 minutes, until the Visible switch is there.
          nearby_shown=0
          bounds=""
          for i in $(seq 1 60); do
            sleep 3
            adb shell uiautomator dump /sdcard/nearby.xml > /dev/null 2>&1 && adb pull /sdcard/nearby.xml out/nearby.xml > /dev/null 2>&1 || continue
            nearby_shown=$(grep -c 'text="Nearby"' out/nearby.xml || true)
            bounds=$(grep -o 'content-desc="Visible to your computers"[^>]*bounds="[^"]*"' out/nearby.xml | grep -o 'bounds="[^"]*"' | head -n 1 || true)
            [ -n "$bounds" ] && break
          done
          nearby_seconds=$(( i * 3 ))
          # What the screen said at the end, for the summary: its words only.
          screen_words=$(grep -o 'text="[^"]\+"' out/nearby.xml 2>/dev/null | sed 's/^text="//; s/"$//' | head -n 12 | paste -sd '|' - || true)
          if [ -n "$bounds" ]; then
            read -r x1 y1 x2 y2 <<<"$(grep -o '[0-9]\+' <<<"$bounds" | tr '\n' ' ')"
            adb shell input tap $(( (x1 + x2) / 2 )) $(( (y1 + y2) / 2 ))
            sleep 6
          fi
          adb exec-out screencap -p > out/nearby.png
          adb shell dumpsys activity services com.farbaek.app | grep -E "ServiceRecord|isForeground|foregroundServiceType" | tee out/nearby-service.txt || true
          service_foreground=$(grep -c 'isForeground=true' out/nearby-service.txt || true)

          # An "isn't responding" report keeps every thread's stack in the dropbox, readable without root.
          adb shell dumpsys dropbox --print data_app_anr > out/anr.txt 2>/dev/null || true
          farbaek_anr=$(grep -c 'Process: com.farbaek.app' out/anr.txt || true)
          adb logcat -d > out/logcat.txt
          adb logcat -d -b crash > out/crash.txt || true
          grep -E "AndroidRuntime|FATAL|com.farbaek.app|androidbrowserhelper|TrustedWebActivity|TwaLauncher|cr_" out/logcat.txt | tail -n 300 > out/logcat-farbaek.txt || true
          {
            echo "### Android launch check"
            echo
            echo '```'
            cat out/am-start.txt
            cat out/resumed.txt
            echo '```'
            echo
            echo "Farbaek crashes: $(grep -c 'Process: com.farbaek.app' out/crash.txt || true). Other apps' crashes on the emulator: $(grep -v -c 'Process: com.farbaek.app' <(grep 'Process: ' out/crash.txt) || true)."
            echo
            echo "Nearby: the screen showed its title $nearby_shown time(s); the Visible switch was ${bounds:+found and tapped}${bounds:-not found} after ${nearby_seconds} s; the transfer service in the foreground: $service_foreground."
            echo
            echo "Nearby's screen said: ${screen_words:-nothing uiautomator could read}."
            echo
            echo "Nearby's own log (how long each step of starting took):"
            echo '```'
            grep 'FarbaekNearby' out/logcat.txt | sed 's/^[0-9-]* //' | head -n 20 || true
            echo '```'
            echo
            echo "Farbaek \"isn't responding\" reports: ${farbaek_anr:-0}."
            if [ "${farbaek_anr:-0}" != "0" ]; then
              # The main thread's stack from the first report: where it was waiting.
              echo '```'
              awk '/Process: com.farbaek.app/{f=1} f&&/^"main"/{p=1} p{print} p&&/^$/{exit}' out/anr.txt | head -n 40
              echo '```'
            fi
            echo
            # Farbaek's crash, on the run's page. Addresses are left out: a stack trace doesn't need them.
            echo '```'
            grep -B1 -A60 'Process: com.farbaek.app' out/crash.txt | grep -v -E 'https?://' | head -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'Process: com.farbaek.app' out/crash.txt; then
            echo "::error::Farbaek stopped at launch. Its stack trace is in the run's summary."; exit 1
          fi
          if [ "${farbaek_anr:-0}" != "0" ]; then
            echo "::error::Android reported Farbaek \"isn't responding\". The main thread's stack is in the run's summary."; exit 1
          fi
          if ! grep -q 'mesh.MeshActivity' out/nearby-start.txt; then
            echo "::error::Nearby didn't open from its link. The screenshot is out/nearby.png in the run's artifact."; exit 1
          fi
          if [ -z "$bounds" ]; then
            echo "::error::Nearby opened, but its Visible switch didn't appear within 3 minutes. What the screen said is in the run's summary, and the screenshot is out/nearby.png."; exit 1
          fi
          if [ -n "$bounds" ] && [ "${service_foreground:-0}" = "0" ]; then
            echo "::error::Turning on Visible didn't start the Nearby service in the foreground."; exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: farbaek-android-launch
          path: out/
          retention-days: 7
          if-no-files-found: warn
